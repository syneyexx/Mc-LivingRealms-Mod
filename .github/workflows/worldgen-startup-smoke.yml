name: Worldgen Startup Smoke

on:
  pull_request:

jobs:
  fresh-server-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Bootstrap Gradle and compile
        run: |
          set -euo pipefail
          V=8.10.2
          EXPECTED_SHA256=31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
          CACHE="$PWD/.gradle-bootstrap"
          HOME_DIR="$CACHE/gradle-$V"
          ZIP="$CACHE/gradle-$V-bin.zip"
          mkdir -p "$CACHE"
          if [ ! -x "$HOME_DIR/bin/gradle" ]; then
            curl -fL "https://services.gradle.org/distributions/gradle-$V-bin.zip" -o "$ZIP"
            echo "$EXPECTED_SHA256  $ZIP" | sha256sum -c -
            unzip -qo "$ZIP" -d "$CACHE"
          fi
          for attempt in 1 2 3; do
            if "$HOME_DIR/bin/gradle" --no-daemon --no-build-cache classes; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle compile failed after 3 attempts" >&2
              exit 1
            fi
            sleep 8
          done
      - name: Start fresh NeoForge server and require completed spawn prep
        run: |
          set -euo pipefail
          V=8.10.2
          GRADLE="$PWD/.gradle-bootstrap/gradle-$V/bin/gradle"
          rm -rf run world runs/server
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          set +e
          timeout 180s "$GRADLE" --no-daemon --no-build-cache runServer > /tmp/lr-server.out 2>&1
          STATUS=$?
          set -e

          LOG=""
          for candidate in run/logs/latest.log runs/server/logs/latest.log logs/latest.log; do
            if [ -f "$candidate" ]; then LOG="$candidate"; break; fi
          done

          echo "===== SERVER STDOUT TAIL ====="
          tail -n 200 /tmp/lr-server.out || true
          if [ -n "$LOG" ]; then
            echo "===== LATEST.LOG TAIL ($LOG) ====="
            tail -n 300 "$LOG" || true
          fi

          if [ -z "$LOG" ]; then
            echo "No Minecraft latest.log produced" >&2
            exit 1
          fi

          grep -F "Starter worldgen context published" "$LOG" || {
            echo "Living Realms worldgen context never published" >&2
            exit 1
          }

          grep -E "Done \([0-9.]+s\)!|For help, type" "$LOG" || {
            echo "Fresh server did not finish spawn preparation within 180 seconds" >&2
            exit 1
          }

          echo "PASS fresh server reached completed startup; timeout status=$STATUS"
      - name: Upload startup logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-startup-smoke-logs
          path: |
            /tmp/lr-server.out
            run/logs/**
            runs/server/logs/**
            logs/**
          if-no-files-found: ignore
